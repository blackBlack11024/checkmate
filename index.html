<title>將死之前</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="吞下棋子，在被將死之前，先吃掉國王。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap">
<style>
/* Layout: full-bleed 3D stage; sparse serif HUD in the corners like captions on an old photograph. */
:root { --bg: #070605; --ink: #efe6d6; --dim: #a69b88; --mute: #6d6456; --gold: #e3b465; --silver: #c9d6e8; --blood: #c8402e; --line: rgba(239, 230, 214, .2);
  --f-zh: "Noto Serif TC", "Songti TC", "PMingLiU", serif; --f-en: "Cormorant Garamond", Georgia, serif; color-scheme: dark; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: var(--f-zh); -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.btn { appearance: none; border: 1px solid var(--line); background: rgba(14, 11, 8, .7); padding: 11px 30px; min-height: 46px; cursor: pointer; font-weight: 600; font-size: 16px; }
.btn.primary { background: var(--gold); color: #140e06; border-color: var(--gold); }
.btn:hover { border-color: var(--gold); }
/* title */
#title { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; text-align: center; z-index: 30;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: radial-gradient(ellipse at center, rgba(7, 6, 5, .15), rgba(7, 6, 5, .85) 75%); }
#title h1 { margin: 0; font-weight: 900; font-size: clamp(60px, 11vw, 128px); letter-spacing: .04em; line-height: 1; color: var(--ink); }

#title .ctrl { font-size: 14px; color: var(--mute); max-width: 92vw; line-height: 1.8; }
#bestline { font-size: 13px; color: var(--dim); min-height: 1em; }
/* hud */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
.tl { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; }
#hp { display: flex; gap: 6px; }
#hp i { width: 16px; height: 20px; border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%; background: rgba(239, 230, 214, .12); border: 1px solid rgba(239, 230, 214, .3); }
#hp i.on { background: radial-gradient(circle at 35% 30%, #5a5560, #0c0a10 70%); border-color: rgba(239, 230, 214, .6); box-shadow: 0 0 8px rgba(0, 0, 0, .8); }
#room { font-size: 14px; color: var(--dim); }
#held { font-size: 13px; color: var(--gold); min-height: 1em; }
.tr { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#gaze { width: 90px; height: 3px; background: rgba(201, 214, 232, .15); overflow: hidden; }
#gaze i { display: block; height: 100%; background: var(--silver); transform-origin: left; }
#fateN { font-size: 13px; color: var(--silver); min-height: 1em; }
#buff { font-size: 12px; color: var(--blood); }
#bossbar { position: absolute; left: 50%; top: max(16px, env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(460px, 56vw); text-align: center; }
#bossbar b { display: block; font-size: 14px; color: var(--ink); margin-bottom: 6px; }
#bossbar div { height: 4px; background: rgba(239, 230, 214, .12); overflow: hidden; }
#bossbar i { display: block; height: 100%; background: var(--ink); transform-origin: left; transition: transform .2s; }
#prompt { position: absolute; left: 0; top: 0; font-size: 14px; color: var(--ink); text-shadow: 0 1px 6px #000; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
#prompt kbd { font-family: var(--f-en); font-weight: 600; font-size: 14px; border: 1px solid var(--gold); color: var(--gold); padding: 0 6px; }

#toast.show { opacity: 1; }
#toast b { display: block; font-size: 17px; } #toast span { font-size: 13px; color: var(--dim); }
#hint { position: absolute; left: 50%; bottom: calc(max(20px, env(safe-area-inset-bottom, 0px)) + 110px); transform: translateX(-50%); font-size: 16px; color: var(--ink); background: rgba(7, 6, 5, .75); padding: 8px 14px; border-left: 2px solid var(--gold); opacity: 0; max-width: min(520px, 90vw); text-align: left; line-height: 1.6; }
#hint.show { animation: hintA 5.5s ease forwards; }
@keyframes hintA { 0% { opacity: 0; } 8% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; } }
#roomcard { position: fixed; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; opacity: 0; z-index: 12; }
#roomcard.show { animation: cardA 2.6s ease forwards; }
#roomcard small { display: block; font-size: 14px; color: var(--dim); margin-bottom: 4px; }
#roomcard b { font-size: clamp(30px, 5vw, 46px); font-weight: 900; }
#roomcard .bossic .ic { width: 64px; height: 64px; color: var(--blood); }
#bossbar b .ic { width: 16px; height: 16px; color: var(--gold); vertical-align: -2px; }
#roomcard .mod { display: flex; justify-content: center; align-items: center; gap: 6px; color: var(--gold); font-size: 18px; font-weight: 600; margin: 6px 0 4px; } #roomcard .mod .ic { width: 28px; height: 28px; }
@keyframes cardA { 0% { opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }

#fade.on { opacity: 1; }
/* overlays */
.ov { position: fixed; inset: 0; z-index: 28; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; background: rgba(7, 6, 5, .78);
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 240px)); gap: 14px; margin-top: 10px; }

.card:hover, .card:focus-visible { border-color: var(--gold); transform: translateY(-4px); }
.card small { position: absolute; top: 8px; left: 12px; font-style: normal; letter-spacing: 0; color: var(--mute); }

.card span { font-size: 14px; color: var(--dim); line-height: 1.7; }
.card em { font-style: normal; font-size: 12px; color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 110px)); gap: 10px; margin: 10px 0; }
.stats div { border: 1px solid var(--line); padding: 10px 6px; display: flex; flex-direction: column; gap: 4px; }
.stats span { font-size: 12px; color: var(--mute); } .stats b { font-size: 19px; }
.best { font-size: 13px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
/* touch */
#touch { position: fixed; inset: 0; pointer-events: none; z-index: 15; display: none; }
@media (pointer: coarse) { #touch:not([hidden]) { display: block; } }
#stick { position: absolute; width: 118px; height: 118px; margin: -59px 0 0 -59px; border-radius: 50%; border: 1px solid rgba(239, 230, 214, .25); opacity: 0; transition: opacity .15s; }
#stick.on { opacity: 1; }
#stick i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(239, 230, 214, .18); border: 1px solid rgba(239, 230, 214, .45); }
.tb { position: absolute; pointer-events: auto; border-radius: 50%; border: 1px solid rgba(239, 230, 214, .35); background: rgba(14, 11, 8, .55); display: grid; place-items: center; font-weight: 900; touch-action: none; }
.tb.down { background: rgba(227, 180, 101, .3); }
#tAtk { width: 78px; height: 78px; font-size: 22px; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 8px); bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 18px); border-color: var(--gold); }
#tAct { width: 58px; height: 58px; font-size: 16px; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 98px); bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 14px); }
#tJump { width: 56px; height: 56px; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 104px); bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 86px); }
#tLook { width: 50px; height: 50px; font-size: 14px; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 30px); bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 108px); color: var(--silver); }
#tPause { width: 40px; height: 40px; top: max(10px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
@media (pointer: coarse) { .tr { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 52px); } }
#nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; z-index: 50; background: var(--bg); }

/* pictograms */
.ic { width: 1.6em; height: 1.6em; display: inline-block; vertical-align: middle; flex: none; }
kbd { font-family: var(--f-en); font-weight: 600; font-size: 14px; border: 1px solid var(--gold); color: var(--gold); padding: 1px 7px; border-radius: 3px; line-height: 1.3; }
.ar { font-style: normal; color: var(--mute); font-size: 20px; }
.silver { color: var(--silver); } .red { color: var(--blood); } .gold { color: var(--gold); }
#room { display: flex; gap: 5px; align-items: center; }
.dots { display: flex; gap: 6px; justify-content: center; align-items: center; }
#room i, .dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid rgba(239,230,214,.35); }
#room i.past, .dots i.past { background: var(--dim); border-color: var(--dim); }

#room i.boss, .dots i.boss { border-radius: 1px; transform: rotate(45deg); }
#held { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--gold); opacity: 0; transition: opacity .2s; background: rgba(0,0,0,.45); border: 1px solid rgba(227,180,101,.4); font-size: 14px; }
#held.on { opacity: 1; }
#held { width: auto; min-width: 40px; height: auto; min-height: 40px; padding: 4px 8px; border-radius: 22px; display: flex; gap: 6px; align-items: center; }
#held .fm { display: flex; align-items: center; gap: 4px; color: var(--ink); } #held .fm .ic { width: 30px; height: 30px; }
#held .hd .ic { width: 22px; height: 22px; } .pips { display: flex; gap: 3px; } .pips i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.gz { display: flex; align-items: center; gap: 6px; color: var(--silver); }
.gz .ic { width: 20px; height: 20px; }
#fateN { display: flex; align-items: center; gap: 4px; font-size: 15px; color: var(--ink); }
#fateN .ic { width: 22px; height: 22px; color: var(--blood); }
#buff .ic { width: 30px; height: 30px; color: var(--blood); animation: pulse .5s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.18); } }
#prompt .ic { width: 30px; height: 30px; } #prompt .pi .ic { width: 22px; height: 22px; color: var(--gold); }
#mark { position: absolute; left: 0; top: 0; color: var(--blood); text-align: center; display: flex; flex-direction: column; align-items: center; animation: bob .5s ease-in-out infinite alternate; text-shadow: 0 1px 4px #000; }
#mark .ic { width: 28px; height: 28px; color: var(--blood); } #mark b { font-size: 26px; font-weight: 900; line-height: 1; } #mark .ar { color: var(--blood); font-size: 18px; line-height: 1; }
@keyframes bob { to { margin-top: -6px; } }
#toast { display: flex; align-items: center; gap: 8px; }
#toast .ic { width: 30px; height: 30px; }
#hint { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-left: 0; border-radius: 30px; background: rgba(7,6,5,.8); border: 1px solid rgba(239,230,214,.15); }
#hint .ic { width: 38px; height: 38px; } #hint b { font-size: 17px; white-space: nowrap; }
.card .big { color: var(--ink); } .card .big .ic { width: 56px; height: 56px; }
.card em { display: flex; gap: 5px; justify-content: center; }
.card em i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--gold); }
.card em i.on { background: var(--gold); }
.endic .ic { width: 84px; height: 84px; }
.stats { grid-template-columns: repeat(3, minmax(0, 110px)) !important; }
.stats div { align-items: center; } .stats .ic { width: 28px; height: 28px; }
.best b { font-size: 22px; color: var(--ink); }
.btn.ib { display: inline-flex; align-items: center; gap: 8px; justify-content: center; } .btn.ib .ic { width: 22px; height: 22px; }
.btn.big { min-width: 76px; min-height: 64px; } .btn.big .ic { width: 30px; height: 30px; }
#ctrl { display: flex; flex-wrap: wrap; gap: 10px 22px; justify-content: center; align-items: center; color: var(--dim); }
#ctrl .g { display: inline-flex; align-items: center; gap: 6px; } #ctrl .ic { width: 30px; height: 30px; }
.tb .ic { width: 58%; height: 58%; }
#tLook { color: var(--silver); }

/* finisher: letterbox + the photograph that develops and flies to the corner */
#bars { position: fixed; inset: 0; pointer-events: none; z-index: 11; }
#bars i { position: absolute; left: 0; right: 0; height: 0; background: #040302; transition: height .25s ease; }
#bars i:first-child { top: 0; } #bars i:last-child { bottom: 0; }
body.exec #bars i { height: 9vh; }

#hud, #touch .tb { transition: opacity .4s; }
#snapfx { position: fixed; left: 50%; top: 50%; z-index: 13; pointer-events: none; opacity: 0; }
#snapfx img { display: block; width: min(240px, 46vw); border: 6px solid #2a2118; outline: 1px solid #8a6a3c; border-radius: 4px; box-shadow: 0 8px 30px rgba(0,0,0,.8); }
#snapfx.show { animation: snapA 1.9s cubic-bezier(.3,.7,.2,1) forwards; }
@keyframes snapA { 0% { opacity: 0; transform: translate(-50%,-50%) scale(1.15) rotate(0deg); filter: brightness(3); }
  12% { opacity: 1; filter: brightness(1.6); } 45% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(-3deg); filter: brightness(1); }
  100% { opacity: 0; transform: translate(calc(-50vw + 40px), calc(-50vh + 60px)) scale(.2) rotate(-12deg); } }
.plates { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: min(720px, 94vw); margin: 4px 0; }
.plates img { width: clamp(84px, 16vw, 132px); border: 4px solid #2a2118; outline: 1px solid #8a6a3c; border-radius: 3px; transform: rotate(var(--r)); box-shadow: 0 4px 14px rgba(0,0,0,.7); }
#goal { position: absolute; left: 50%; top: calc(max(14px, env(safe-area-inset-top, 0px)) + 34px); transform: translateX(-50%); display: flex; gap: 2px; align-items: center; color: var(--blood); }
#goal .ic { width: 26px; height: 26px; } #goal.open { color: var(--gold); animation: pulse .6s ease-in-out infinite alternate; }
#goal.open .ic { width: 32px; height: 32px; }
#doorArrow { position: absolute; left: 0; top: 0; color: var(--gold); display: flex; flex-direction: column; align-items: center; text-shadow: 0 1px 6px #000; animation: bob .45s ease-in-out infinite alternate; }
#doorArrow .ic { width: 34px; height: 34px; filter: drop-shadow(0 0 6px rgba(227,180,101,.7)); } #doorArrow i { font-style: normal; font-size: 22px; font-weight: 900; line-height: 1; }
.panels { display: grid; grid-template-columns: repeat(3, minmax(0, 210px)); gap: 12px; }
.panel { border: 1px solid var(--line); background: rgba(18,14,10,.9); padding: 18px 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.panel .pic { display: flex; align-items: center; gap: 6px; min-height: 52px; } .panel .pic .ic { width: 44px; height: 44px; }
.panel b { font-size: 17px; } .panel .n { color: var(--mute); font-size: 13px; }
#coach { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; color: var(--gold); padding: 5px 10px; border-radius: 22px; background: rgba(7,6,5,.72); border: 1px solid rgba(227,180,101,.5); animation: bob .5s ease-in-out infinite alternate; white-space: nowrap; }
#coach .ic { width: 30px; height: 30px; } #coach .ar { color: var(--gold); }
#fatecard { display: flex; justify-content: center; align-items: center; gap: 6px; } #fatecard .ic { width: 1.1em; height: 1.1em; color: var(--blood); }
#buff { display: flex; align-items: center; gap: 2px; color: var(--blood); font-weight: 900; font-size: 18px; } #buff .ic { animation: none; width: 26px; height: 26px; }
#combo { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); top: 34%; text-align: right; color: var(--ink); text-shadow: 0 2px 0 var(--blood), 0 0 18px rgba(200,64,46,.5); line-height: 1; }
#combo small { display: block; font-size: 16px; color: var(--dim); text-shadow: none; } #combo b { font-size: clamp(44px, 7vw, 72px); font-weight: 900; }
#combo.pop b { animation: comboA .35s cubic-bezier(.2,1.6,.4,1); } @keyframes comboA { from { transform: scale(1.7); } to { transform: scale(1); } }
#combo i { display: block; height: 3px; background: var(--blood); margin-top: 6px; transform-origin: right; }
@media (pointer: coarse) { #combo { top: 22%; } }
#startPick { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.sp { appearance: none; background: rgba(14,11,8,.7); border: 1px solid var(--line); width: 58px; min-height: 58px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: var(--ink); }
.sp .ic { width: 30px; height: 30px; } .sp.on { border-color: var(--gold); color: var(--gold); } .sp.lock { opacity: .4; cursor: default; } .sp small { font-size: 9px; color: var(--dim); line-height: 1.2; }
.unl { display: flex; align-items: center; gap: 8px; color: var(--gold); font-size: 18px; } .unl .ic { width: 40px; height: 40px; }
#perf { position: absolute; left: 0; top: 0; color: var(--gold); font-weight: 900; font-size: 22px; text-shadow: 0 1px 6px #000, 0 0 12px rgba(227,180,101,.6); white-space: nowrap; }
#perf small { font-size: 14px; margin-left: 2px; } #perf.pop { animation: perfA .42s ease-out; } @keyframes perfA { from { margin-top: 8px; opacity: .3; } 30% { opacity: 1; } to { margin-top: -14px; } }
.invi { display: inline-flex; transform: rotate(180deg); color: var(--silver); }
#peds { position: absolute; inset: 0; pointer-events: none; }
.ped { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; width: 92px; padding: 6px 6px 7px; background: rgba(10,8,6,.82); border: 1px solid rgba(227,180,101,.35); text-align: center; transition: width .15s, opacity .15s; opacity: .72; }
.ped b { font-size: 14px; color: var(--gold); } .ped span { display: none; font-size: 12px; color: var(--ink); line-height: 1.35; }
.ped.near { width: 148px; opacity: 1; border-color: var(--gold); z-index: 2; } .ped.near span { display: block; }
.diag { width: 62px; height: 56px; } .ped.near .diag { width: 110px; height: 100px; }
.diag .dl { stroke-dasharray: 60; stroke-dashoffset: 60; animation: dlA 1.6s ease-in-out infinite; } .diag .d2 { animation-delay: .6s; }
.diag .dr { transform-box: fill-box; transform-origin: center; animation: drA 1.6s ease-out infinite; } .diag .db { animation: dbA 1s ease-in-out infinite; }
